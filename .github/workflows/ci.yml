name: CI

on:
  push:
    branches: [main, '*.x']
  pull_request:
  # Nothing here is pinned: composer.lock is not committed, so every run resolves
  # the newest versions the constraints allow. That is deliberate for a library --
  # it is what consumers will get -- but it means the tools can change under a
  # commit that did not. Without a clock, the change surfaces whenever someone
  # happens to push next, attributed to whatever they were working on.
  #
  # It happened: main last ran CI on 2026-09-01 and was green. Pint shipped
  # 1.30.6 through 1.32.1 between the 7th and the 10th, Rector shipped 2.6.7 on
  # the 13th, and the next run -- an unrelated PR on the 16th -- failed on five
  # files nobody had touched. A nightly run puts that failure on main, alone, the
  # morning it appears.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # Tier 1: Lint (parallel) — fast code style checks
  # ──────────────────────────────────────────────
  pint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Check code style
        run: composer test:pint

  rector:
    name: Rector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Check Rector
        run: composer test:rector

  # ──────────────────────────────────────────────
  # Tier 2: Analysis & Tests (parallel, after lint)
  # ──────────────────────────────────────────────
  larastan:
    name: Larastan
    needs: [pint, rector]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --error-format=github

  pest-types:
    name: Pest Types
    needs: [pint, rector]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Execute type coverage
        run: vendor/bin/pest --type-coverage --min=100 --colors=always --testsuite='Tarfinlabs Test Suite'

  coverage:
    name: Coverage
    needs: [pint, rector]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      # Runs the same command the local quality gate runs, so a CRAP failure here
      # reproduces with `composer test` rather than only in CI.
      - name: Execute tests with coverage
        run: composer test:coverage

      # Reads the clover report the step above produced — no second test run.
      - name: CRAP gate
        run: composer test:crap

  pest:
    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}
    needs: [pint, rector]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4, 8.5]
        laravel: [11, 12, 13]
        stability: [prefer-lowest, prefer-stable]

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Remove PHP 8.4+ only packages
        if: matrix.php == '8.3'
        run: composer remove --dev testflowlabs/doctest --no-update

      - name: Remove Laravel 12+ only packages
        if: matrix.laravel == '11'
        run: composer remove --dev laravel/pao --no-update

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --with="illuminate/contracts:^${{ matrix.laravel }}"

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --parallel --no-coverage --colors=always --order-by=random --testsuite='Tarfinlabs Test Suite'

  doctest:
    name: DocTest
    needs: [pint, rector]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run DocTest
        run: composer test:doc

  # ──────────────────────────────────────────────
  # Tier 3: Mutation Testing (manual trigger only)
  # ──────────────────────────────────────────────
  infection:
    name: Infection
    if: github.event_name == 'workflow_dispatch'
    needs: [pest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run Infection
        run: composer test:mutation
